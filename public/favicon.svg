<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Metallic Bus Gradient -->
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Gold Thermal Foil Gradient (authentic space craft MLI) -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Solar Cell Silicon Blue Gradient -->
    <linearGradient id="solarCell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Dish Reflector Gradient -->
    <linearGradient id="dishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Rotate 45 degrees so wings stretch diagonally, maximizing icon footprint -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    
    <!-- === LEFT SOLAR ARRAY WING === -->
    <!-- Solar wing truss rod -->
    <rect x="90" y="248" width="100" height="16" rx="6" fill="#64748b" stroke="#334155" stroke-width="3"/>
    
    <!-- Left Panel 1 (Outer) -->
    <g>
      <rect x="30" y="180" width="85" height="152" rx="10" fill="#0f172a" stroke="#334155" stroke-width="4"/>
      <rect x="36" y="186" width="73" height="140" rx="6" fill="url(#solarCell)"/>
      <!-- Photovoltaic cell grid lines -->
      <line x1="36" y1="221" x2="109" y2="221" stroke="#e0f2fe" stroke-width="2" stroke-opacity="0.6"/>
      <line x1="36" y1="256" x2="109" y2="256" stroke="#e0f2fe" stroke-width="2.5" stroke-opacity="0.8"/>
      <line x1="36" y1="291" x2="109" y2="291" stroke="#e0f2fe" stroke-width="2" stroke-opacity="0.6"/>
      <line x1="72" y1="186" x2="72" y2="326" stroke="#e0f2fe" stroke-width="2.5" stroke-opacity="0.8"/>
    </g>

    <!-- Left Panel 2 (Inner) -->
    <g>
      <rect x="125" y="180" width="85" height="152" rx="10" fill="#0f172a" stroke="#334155" stroke-width="4"/>
      <rect x="131" y="186" width="73" height="140" rx="6" fill="url(#solarCell)"/>
      <!-- Photovoltaic cell grid lines -->
      <line x1="131" y1="221" x2="204" y2="221" stroke="#e0f2fe" stroke-width="2" stroke-opacity="0.6"/>
      <line x1="131" y1="256" x2="204" y2="256" stroke="#e0f2fe" stroke-width="2.5" stroke-opacity="0.8"/>
      <line x1="131" y1="291" x2="204" y2="291" stroke="#e0f2fe" stroke-width="2" stroke-opacity="0.6"/>
      <line x1="167" y1="186" x2="167" y2="326" stroke="#e0f2fe" stroke-width="2.5" stroke-opacity="0.8"/>
    </g>

    <!-- === RIGHT SOLAR ARRAY WING === -->
    <!-- Solar wing truss rod -->
    <rect x="322" y="248" width="100" height="16" rx="6" fill="#64748b" stroke="#334155" stroke-width="3"/>

    <!-- Right Panel 1 (Inner) -->
    <g>
      <rect x="302" y="180" width="85" height="152" rx="10" fill="#0f172a" stroke="#334155" stroke-width="4"/>
      <rect x="308" y="186" width="73" height="140" rx="6" fill="url(#solarCell)"/>
      <!-- Grid lines -->
      <line x1="308" y1="221" x2="381" y2="221" stroke="#e0f2fe" stroke-width="2" stroke-opacity="0.6"/>
      <line x1="308" y1="256" x2="381" y2="256" stroke="#e0f2fe" stroke-width="2.5" stroke-opacity="0.8"/>
      <line x1="308" y1="291" x2="381" y2="291" stroke="#e0f2fe" stroke-width="2" stroke-opacity="0.6"/>
      <line x1="344" y1="186" x2="344" y2="326" stroke="#e0f2fe" stroke-width="2.5" stroke-opacity="0.8"/>
    </g>

    <!-- Right Panel 2 (Outer) -->
    <g>
      <rect x="397" y="180" width="85" height="152" rx="10" fill="#0f172a" stroke="#334155" stroke-width="4"/>
      <rect x="403" y="186" width="73" height="140" rx="6" fill="url(#solarCell)"/>
      <!-- Grid lines -->
      <line x1="403" y1="221" x2="476" y2="221" stroke="#e0f2fe" stroke-width="2" stroke-opacity="0.6"/>
      <line x1="403" y1="256" x2="476" y2="256" stroke="#e0f2fe" stroke-width="2.5" stroke-opacity="0.8"/>
      <line x1="403" y1="291" x2="476" y2="291" stroke="#e0f2fe" stroke-width="2" stroke-opacity="0.6"/>
      <line x1="439" y1="186" x2="439" y2="326" stroke="#e0f2fe" stroke-width="2.5" stroke-opacity="0.8"/>
    </g>

    <!-- === MAIN SATELLITE BUS (CENTRAL BODY) === -->
    <!-- Gold foil primary structure -->
    <rect x="206" y="206" width="100" height="100" rx="18" fill="url(#goldFoil)" stroke="#78350f" stroke-width="4"/>

    <!-- Multi-Layer Insulation quilted patterns -->
    <line x1="206" y1="240" x2="306" y2="240" stroke="#78350f" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="206" y1="272" x2="306" y2="272" stroke="#78350f" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="240" y1="206" x2="240" y2="306" stroke="#78350f" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="272" y1="206" x2="272" y2="306" stroke="#78350f" stroke-width="2" stroke-opacity="0.5"/>

    <!-- Central scientific instrument bay / optical camera window -->
    <rect x="228" y="228" width="56" height="56" rx="12" fill="url(#busGrad)" stroke="#1e293b" stroke-width="3"/>
    <circle cx="256" cy="256" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="256" cy="256" r="8" fill="#0284c7"/>
    <circle cx="252" cy="252" r="3" fill="#ffffff" opacity="0.9"/>

    <!-- === HIGH-GAIN PARABOLIC DISH ANTENNA (TOP) === -->
    <!-- Feed boom strut -->
    <line x1="256" y1="206" x2="256" y2="130" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Dish reflector bowl -->
    <path d="M200 130 C 220 95, 292 95, 312 130 Z" fill="url(#dishGrad)" stroke="#475569" stroke-width="3.5"/>
    
    <!-- Sub-reflector feed horn & tripod struts -->
    <line x1="208" y1="126" x2="256" y2="90" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="304" y1="126" x2="256" y2="90" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="256" cy="90" r="6" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>

    <!-- Omnidirectional telemetry antennas -->
    <line x1="222" y1="206" x2="212" y2="170" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <circle cx="212" cy="170" r="4" fill="#ef4444"/>
    <line x1="290" y1="206" x2="300" y2="170" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <circle cx="300" cy="170" r="4" fill="#22c55e"/>

    <!-- === APOGEE KICK MOTOR / RCS THRUSTER (BOTTOM) === -->
    <path d="M238 306 L226 348 L286 348 L274 306 Z" fill="#475569" stroke="#1e293b" stroke-width="3.5"/>
    <!-- Nozzle interior bell -->
    <ellipse cx="256" cy="348" rx="30" ry="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    
    <!-- Ion drive / exhaust glow -->
    <ellipse cx="256" cy="354" rx="16" ry="6" fill="#38bdf8" opacity="0.85"/>
    <circle cx="256" cy="354" r="4" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>